[project]
name = "medarc-rl"
version = "0.1.0"
description = "MedARC environments, utilities, and tools for PrimeRL"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "jinja2>=3.1.0",
    "medarc-verifiers",
    "prime-rl",
    "tomli-w>=1.2.0",
    "torchvision",
    "typer>=0.24.1",
    "verifiers",
    "wandb>=0.26.1",
    "vllm>=0.20.2"
]

[project.optional-dependencies]
envs = ["prime-rl[envs]"]
fa2 = ["prime-rl[flash-attn]"]
fa3 = ["prime-rl[flash-attn]", "flash_attn_3"]
fa4 = ["prime-rl[flash-attn]", "flash_attn_3", "flash-attn-4>=4.0.0b4"]
flash-attn-2 = ["prime-rl[flash-attn]"]
flash-attn-3 = ["prime-rl[flash-attn]", "flash_attn_3"]
flash-attn-4 =  ["prime-rl[flash-attn]", "flash_attn_3", "flash-attn-4>=4.0.0b4"]

[project.scripts]
medarc_slurm = "medarc_rl.medarc_slurm:app"
medarc_train = "medarc_rl.medarc_train:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "medarc_rl"
module-root = ""

[tool.uv.sources]
prime-rl = { path = "prime-rl", editable = true }
prime-rl-configs = { path = "prime-rl/packages/prime-rl-configs", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "c1c3424" }
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
dion = { git = "https://github.com/samsja/dion.git", rev = "d891eeb" }
pydantic-config = { git = "https://github.com/samsja/pydantic_config.git", branch = "main" }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "aa428f3" }
vllm = [
    { url = "https://github.com/vllm-project/vllm/releases/download/v0.20.2/vllm-0.20.2+cu129-cp38-abi3-manylinux_2_31_x86_64.whl", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/vllm-project/vllm/releases/download/v0.20.2/vllm-0.20.2+cu129-cp38-abi3-manylinux_2_31_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]
flash-attn-4 = { git = "https://github.com/Dao-AILab/flash-attention.git", subdirectory = "flash_attn/cute", rev = "96bd151" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention" }
reverse-text = { index = "primeintellect" }
alphabet-sort = { index = "primeintellect" }
wiki-search = { index = "primeintellect" }
math-python = { index = "primeintellect" }
math-env = { index = "primeintellect" }
code-env = { index = "primeintellect" }
science-env = { index = "primeintellect" }
logic-env = { index = "primeintellect" }
color-codeword = { index = "primeintellect" }
math500 = { index = "primeintellect" }
aime2024 = { index = "primeintellect" }
aime2025 = { index = "primeintellect" }
deepdive = { index = "primeintellect" }
mini_swe_agent_plus = { index = "primeintellect" }
flash_attn_3 = { index = "pytorch-cu128-test" }

[[tool.uv.index]]
name = "primeintellect"
url = "https://hub.primeintellect.ai/primeintellect/simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128-test"
url = "https://download.pytorch.org/whl/test/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.uv]
preview = true
package = true
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
override-dependencies = [
    "nvidia-cudnn-cu12>=9.15",
    "nvidia-cutlass-dsl>=4.4.1",
    "verifiers",
    "vllm>=0.20.2",
    "transformers>=5.1.0.dev0",
    "quack-kernels>=0.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
